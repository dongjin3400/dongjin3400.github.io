<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>웃음꽃이 피었습니다</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050611;
    }

    body {
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .main {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px;

      background:
        linear-gradient(
          rgba(3, 5, 15, 0.30),
          rgba(3, 5, 15, 0.55)
        ),
        url("웃음꽃_배경.png");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cards {
      width: 100%;
      max-width: 1350px;

      height: 72vh;
      max-height: 760px;
      min-height: 520px;

      display: flex;
      gap: 22px;
    }

    .card {
      position: relative;

      flex: 1;

      overflow: hidden;

      border: 1px solid rgba(160, 170, 255, 0.25);

      text-decoration: none;

      background: rgba(0, 0, 0, 0.25);

      transition:
        flex 0.5s cubic-bezier(.2,.8,.2,1),
        transform 0.5s ease,
        filter 0.5s ease,
        border-color 0.5s ease,
        box-shadow 0.5s ease;
    }

    .card img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter: brightness(0.68);

      transition:
        transform 0.6s ease,
        filter 0.5s ease;
    }

    /* PC 카드 전체에 마우스를 올렸을 때 */
    .cards:hover .card {
      flex: 0.85;
    }

    /* PC 선택한 카드 */
    .cards .card:hover {
      flex: 1.35;

      transform: translateY(-7px);

      border-color: rgba(160, 175, 255, 0.8);

      box-shadow:
        0 0 30px rgba(80, 100, 255, 0.35),
        0 15px 50px rgba(0, 0, 0, 0.55);

      z-index: 5;
    }

    .cards .card:hover img {
      transform: scale(1.04);

      filter:
        brightness(1.05)
        contrast(1.05);
    }

    /* PC에서 마우스를 올리지 않은 다른 카드 */
    .cards:hover .card:not(:hover) img {
      filter:
        brightness(0.42)
        saturate(0.75);
    }


    /* 태블릿 */
    @media (max-width: 1000px) {

      .main {
        padding: 30px;
      }

      .cards {
        height: 65vh;
        gap: 14px;
      }

    }


    /* =========================
       휴대폰
    ========================= */
    @media (max-width: 700px) {

      .main {
        min-height: 100vh;

        align-items: flex-start;

        padding: 24px 16px 40px;

        background-position: center top;
        background-attachment: scroll;
      }

      .cards {
        width: 100%;

        height: auto;
        min-height: 0;
        max-height: none;

        display: flex;
        flex-direction: column;

        gap: 18px;
      }

      .card {
        width: 100%;
        height: auto;

        flex: none;

        overflow: hidden;

        border: 1px solid rgba(160, 170, 255, 0.30);
      }

      .card img {
        width: 100%;
        height: auto;

        display: block;

        object-fit: contain;

        filter: brightness(0.90);

        transform: none;
      }

      /* 휴대폰에서는 PC용 hover 효과 제거 */
      .cards:hover .card,
      .cards .card:hover,
      .cards:hover .card:not(:hover) {
        flex: none;
        transform: none;
      }

      .cards:hover .card img,
      .cards .card:hover img,
      .cards:hover .card:not(:hover) img {
        transform: none;
        filter: brightness(0.90);
      }

      /* 누를 때만 살짝 반응 */
      .card:active {
        transform: scale(0.98);
      }

      .card:active img {
        filter: brightness(1.05);
      }

    }

  </style>
</head>

<body>

  <main class="main">

    <div class="cards">

      <a class="card" href="world.html">
        <img
          src="웃음꽃_월드.png"
          alt="WORLD">
      </a>


      <a class="card" href="characters.html">
        <img
          src="웃음꽃_캐릭터.png"
          alt="CHARACTERS">
      </a>


      <a class="card" href="webtoon.html">
        <img
          src="웃음꽃_웹툰.png"
          alt="WEBTOON">
      </a>

    </div>

  </main>

</body>
</html>
