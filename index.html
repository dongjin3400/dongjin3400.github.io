<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>웃음꽃이 피었습니다</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #050611;
    }

    body {
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .main {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 50px;

      background:
        linear-gradient(
          rgba(3, 5, 15, 0.30),
          rgba(3, 5, 15, 0.55)
        ),
        url("웃음꽃_배경.png?v=3");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .cards {
      width: 100%;
      max-width: 1350px;

      height: 72vh;
      max-height: 760px;
      min-height: 520px;

      display: flex;
      gap: 22px;
    }

    .card {
      position: relative;

      flex: 1;

      overflow: hidden;

      border: 1px solid rgba(160, 170, 255, 0.25);

      text-decoration: none;

      background: rgba(0, 0, 0, 0.25);

      transition:
        flex 0.5s cubic-bezier(.2,.8,.2,1),
        transform 0.5s ease,
        filter 0.5s ease,
        border-color 0.5s ease,
        box-shadow 0.5s ease;
    }

    .card img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter: brightness(0.68);

      transition:
        transform 0.6s ease,
        filter 0.5s ease;
    }

    /* =========================
       카드 제목
    ========================= */

    .card-title {
      position: absolute;

      left: 50%;

      z-index: 10;

      transform: translateX(-50%);

      color: rgba(255, 255, 255, 0.96);

      font-size: clamp(22px, 2.2vw, 34px);
      font-weight: 400;

      letter-spacing: 7px;

      white-space: nowrap;

      pointer-events: none;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.75),
        0 0 18px rgba(255, 255, 255, 0.25);

      transition:
        transform 0.4s ease,
        letter-spacing 0.4s ease,
        text-shadow 0.4s ease;
    }

    /* 각 이미지 구도에 맞춘 글자 위치 */

    .characters-card .card-title {
      top: 80%;
    }

    .world-card .card-title {
      top: 18%;
    }

    .webtoon-card .card-title {
      top: 17%;
    }

    /* =========================
       PC hover 효과
    ========================= */

    .cards:hover .card {
      flex: 0.85;
    }

    .cards .card:hover {
      flex: 1.35;

      transform: translateY(-7px);

      border-color: rgba(160, 175, 255, 0.8);

      box-shadow:
        0 0 30px rgba(80, 100, 255, 0.35),
        0 15px 50px rgba(0, 0, 0, 0.55);

      z-index: 5;
    }

    .cards .card:hover img {
      transform: scale(1.04);

      filter:
        brightness(1.05)
        contrast(1.05);
    }

    .cards .card:hover .card-title {
      transform:
        translateX(-50%)
        scale(1.06);

      letter-spacing: 8px;

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(255, 255, 255, 0.45);
    }

    /* 선택하지 않은 카드 어둡게 */
    .cards:hover .card:not(:hover) img {
      filter:
        brightness(0.42)
        saturate(0.75);
    }

    /* =========================
       태블릿
    ========================= */

    @media (max-width: 1000px) {

      .main {
        padding: 30px;
      }

      .cards {
        height: 65vh;
        gap: 14px;
      }

      .card-title {
        font-size: 22px;
        letter-spacing: 5px;
      }

    }

    /* =========================
       모바일
    ========================= */

    @media (max-width: 700px) {

      .main {
        min-height: 100vh;

        align-items: flex-start;

        padding: 24px 16px 40px;

        background-position: center top;
        background-attachment: scroll;
      }

      .cards {
        width: 100%;

        height: auto;
        min-height: 0;
        max-height: none;

        display: flex;
        flex-direction: column;

        gap: 18px;
      }

      .card {
        width: 100%;
        height: auto;

        flex: none;

        overflow: hidden;

        border: 1px solid rgba(160, 170, 255, 0.30);
      }

      .card img {
        width: 100%;
        height: auto;

        display: block;

        object-fit: contain;

        filter: brightness(0.90);

        transform: none;
      }

      .card-title {
        font-size: clamp(19px, 6vw, 24px);
        letter-spacing: 4px;
      }

      /* 모바일에서도 이미지별 글자 위치 유지 */

      .characters-card .card-title {
        top: 80%;
      }

      .world-card .card-title {
        top: 17%;
      }

      .webtoon-card .card-title {
        top: 16%;
      }

      /* 모바일에서는 PC hover 효과 제거 */

      .cards:hover .card,
      .cards .card:hover,
      .cards:hover .card:not(:hover) {
        flex: none;
        transform: none;
      }

      .cards:hover .card img,
      .cards .card:hover img,
      .cards:hover .card:not(:hover) img {
        transform: none;
        filter: brightness(0.90);
      }

      .cards .card:hover .card-title {
        transform: translateX(-50%);
        letter-spacing: 4px;
      }

      /* 터치했을 때만 살짝 반응 */

      .card:active {
        transform: scale(0.98);
      }

      .card:active img {
        filter: brightness(1.05);
      }

    }

  </style>
</head>


<body>

  <main class="main">

    <div class="cards">


      <!-- =========================
           CHARACTERS
      ========================= -->

      <a
        class="card characters-card"
        href="characters.html">

        <img
          src="웃음꽃_캐릭터.png?v=4"
          alt="CHARACTERS">

        <div class="card-title">
          CHARACTERS
        </div>

      </a>


      <!-- =========================
           WORLD
      ========================= -->

      <a
        class="card world-card"
        href="world.html">

        <img
          src="웃음꽃_월드.png?v=4"
          alt="WORLD">

        <div class="card-title">
          WORLD
        </div>

      </a>


      <!-- =========================
           WEBTOON
      ========================= -->

      <a
        class="card webtoon-card"
        href="webtoon.html">

        <img
          src="웃음꽃_웹툰.png?v=4"
          alt="WEBTOON">

        <div class="card-title">
          WEBTOON
        </div>

      </a>


    </div>

  </main>

</body>
</html>
